name: Build AMD AI Developer OS ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    name: Build Debian Live Hybrid ISO
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space on Host
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          df -h

      - name: Generate build script
        run: |
          cat << 'EOF' > build.sh
          #!/bin/bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          echo "=== 1. Установка сборочного инструментария ==="
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            ca-certificates \
            curl \
            git \
            cmake \
            ninja-build \
            build-essential \
            libcurl4-openssl-dev \
            pkg-config

          mkdir -p /build-dir && cd /build-dir

          echo "=== 2. Конфигурация Live-системы ==="
          lb config \
            --distribution bookworm \
            --archive-areas "main contrib non-free non-free-firmware" \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --bootloaders "syslinux,grub-efi" \
            --debian-installer false \
            --security true \
            --updates true \
            --memtest none

          echo "=== 3. Добавление пакетов (Драйверы, SPIRV, GUI, IDE) ==="
          mkdir -p config/package-lists
          cat << 'PKGS' > config/package-lists/custom.list.chroot
          live-boot
          live-config
          live-config-systemd
          linux-image-amd64
          firmware-amd-graphics
          mesa-vulkan-drivers
          vulkan-tools
          radeontop
          calamares
          calamares-settings-debian
          xfce4
          xfce4-terminal
          lightdm
          network-manager
          network-manager-gnome
          sudo
          systemd-zram-generator
          build-essential
          gdb
          clang
          cmake
          ninja-build
          git
          curl
          wget
          tmux
          neovim
          ripgrep
          fd-find
          python3
          python3-pip
          python3-venv
          libvulkan1
          libvulkan-dev
          glslc
          glslang-tools
          spirv-headers
          spirv-tools
          libgomp1
          libcurl4-openssl-dev
          pkg-config
          PKGS

          echo "=== 4. Создание хука кастомизации ядра и AI-сервисов ==="
          mkdir -p config/hooks/live
          cat << 'HOOK' > config/hooks/live/99-setup-ai.hook.chroot
          #!/bin/bash
          set -e

          # Установка недостающих SPIR-V зависимостей непосредственно перед сборкой
          apt-get update
          apt-get install -y --no-install-recommends \
              spirv-headers \
              spirv-tools \
              glslang-tools \
              glslc \
              libvulkan-dev \
              libcurl4-openssl-dev \
              pkg-config

          # Конфигурация сжатого пула памяти ZRAM
          cat << 'ZRAM' > /etc/systemd/zram-generator.conf
          [zram0]
          zram-size = ram * 1.0
          compression-algorithm = zstd
          swap-priority = 100
          ZRAM

          # Тюнинг подсистемы виртуальной памяти под большие контексты
          cat << 'SYSCTL' > /etc/sysctl.d/99-ai.conf
          vm.swappiness = 180
          vm.max_map_count = 2097152
          fs.file-max = 2097152
          SYSCTL

          # Компиляция движка инференса под Zen 3 AVX2 + Vulkan
          echo "[HOOK] Компиляция llama.cpp..."
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git /tmp/llama.cpp
          cd /tmp/llama.cpp
          cmake -B build -G Ninja \
              -DGGML_VULKAN=ON \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_FLAGS="-march=znver3 -O3" \
              -DCMAKE_CXX_FLAGS="-march=znver3 -O3"
          ninja -C build llama-server
          install -m 755 build/bin/llama-server /usr/local/bin/llama-server
          rm -rf /tmp/llama.cpp

          # Регистрация системного сервиса инференса
          mkdir -p /opt/models
          cat << 'SERVICE' > /etc/systemd/system/llama-server.service
          [Unit]
          Description=Llama.cpp Vulkan Server (Qwen2.5-Coder-7B)
          After=network.target

          [Service]
          Type=simple
          Restart=always
          RestartSec=3
          LimitMEMLOCK=infinity
          LimitNOFILE=65535
          Environment="GGML_VULKAN_DEVICE=0"
          ExecStart=/usr/local/bin/llama-server \
              --model /opt/models/model.gguf \
              --host 0.0.0.0 \
              --port 8080 \
              --alias "qwen2.5-coder-7b" \
              --n-gpu-layers 99 \
              --ctx-size 12288 \
              --batch-size 512 \
              --ubatch-size 256 \
              --threads 8 \
              --temp 0.2 \
              --top-p 0.95 \
              --flash-attn \
              --cont-batching

          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl enable llama-server.service

          # Утилита быстрой загрузки Qwen2.5-Coder
          cat << 'DL' > /usr/local/bin/fetch-model
          #!/bin/bash
          echo "Скачивание Qwen2.5-Coder-7B-Instruct-Q4_K_M (~4.7 GB)..."
          curl -L --progress-bar -C - \
              "https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/qwen2.5-coder-7b-instruct-q4_k_m.gguf" \
              -o /opt/models/model.gguf
          systemctl restart llama-server
          echo "Модель готова: http://127.0.0.1:8080"
          DL
          chmod +x /usr/local/bin/fetch-model
          HOOK
          chmod +x config/hooks/live/99-setup-ai.hook.chroot

          echo "=== 5. Сборка ISO ==="
          lb build

          mkdir -p /workspace/output
          find . -maxdepth 1 -name "*.iso" -exec cp {} /workspace/output/amd-ai-developer-os.iso \;
          EOF
          chmod +x build.sh

      - name: Execute ISO Build in Native Debian Container
        run: |
          docker run --privileged --rm \
            -v /dev:/dev \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            debian:bookworm \
            /workspace/build.sh

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amd-ai-developer-os-iso
          path: output/amd-ai-developer-os.iso
          retention-days: 5
